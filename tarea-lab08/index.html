<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab 08 - DOM, eventos y objetos</title>
    <link rel="stylesheet" href="estilos.css" />
  </head>
  <body>
    <main class="contenedor">
      <img
        src="img/programacion.png"
        alt="Ilustración de DOM en programación web"
        class="imagen-principal"
      />
      <h1 id="titulo">Mi primera pagina interactiva</h1>

      <section>
        <h2>Ejercicio 2: DOM</h2>
        <p class="mensaje">Este texto va a cambiar.</p>
        <ul id="lista">
          <li>HTML</li>
          <li>CSS</li>
        </ul>
      </section>

      <section>
        <h2>Ejercicio 3: Click</h2>
        <button id="btnSumar" type="button">Sumar 1</button>
        <button id="btnReiniciar" type="button">Reiniciar</button>
        <p>Clics: <span id="contador">0</span></p>
        <p id="mensajeContador" class="mensaje" role="status"></p>
      </section>

      <section>
        <h2>Ejercicio 4: Input y submit</h2>

        <label for="nombre">Nombre</label>
        <input id="nombre" type="text" placeholder="Escribe tu nombre" />
        <p id="saludo" class="mensaje" role="status">Hola, ...</p>

        <form id="formulario">
          <label for="correo">Correo electrónico</label>
          <input
            id="correo"
            type="email"
            placeholder="nombre@ejemplo.com"
            required
          />
          <button type="submit">Enviar</button>
        </form>

        <p id="resultado" class="mensaje" role="status"></p>
      </section>

      <section>
        <h2>Ejercicio 5: Clases y objetos</h2>
        <ul id="productos"></ul>
      </section>

      <section>
        <h2>Ejercicio 6: Todo junto</h2>

        <form id="formProducto">
          <label for="prodNombre">Nombre del producto</label>
          <input
            id="prodNombre"
            type="text"
            placeholder="Ej. Cuaderno"
            required
          />

          <label for="prodPrecio">Precio (S/)</label>
          <input
            id="prodPrecio"
            type="number"
            min="0.01"
            step="0.01"
            placeholder="Ej. 15.50"
            required
          />

          <button type="submit">Agregar</button>
        </form>

        <p id="mensajeCarrito" class="mensaje" role="status"></p>
        <ul id="carrito"></ul>
        <p>Total: S/ <span id="total">0.00</span></p>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
